name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # --no-install so this fails loudly if typescript is missing locally,
      # rather than silently fetching an unrelated package named "tsc".
      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit (high severity)
        run: npm audit --audit-level=high
