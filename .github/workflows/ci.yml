name: CI

# Every step is a gate. The previous workflow wrapped lint, build, test and
# audit in `|| echo` / `|| true`, so it could not fail — while main carried
# 206 type errors.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Docs (links resolve, Mermaid closed, status lines)
        run: bash scripts/check-docs.sh

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (API guards)
        run: npm test

      - name: Build
        run: npm run build

      - name: Client bundle carries no Gemini client or key
        run: |
          if grep -lE 'generativelanguage\.googleapis\.com|@google/genai|GoogleGenAI' dist/assets/*.js; then
            echo "::error::client bundle references the Gemini API"; exit 1
          fi

      - name: Dependency audit (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high
